<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="kids.css" />
  <link rel="stylesheet" href="tools.css" />
</head>
<body>
  <div class="phone" style="display:flex;flex-direction:column;justify-content:center">
    <div style="text-align:center;margin-bottom:6px">
      <div style="font-size:64px;line-height:1">🎹</div>
    </div>
    <h1 class="hero-home">Kids Piano</h1>
    <p class="sub" style="text-align:center;margin-top:6px">
      Play the real piano. The phone listens.
    </p>

    <div style="display:flex;justify-content:center;gap:7px;margin:22px 0 4px">
      <span class="dot" style="background:#e5484d;width:20px;height:20px"></span>
      <span class="dot" style="background:#f76b15;width:20px;height:20px"></span>
      <span class="dot" style="background:#e8b931;width:20px;height:20px"></span>
      <span class="dot" style="background:#2fa84f;width:20px;height:20px"></span>
      <span class="dot" style="background:#3a7dde;width:20px;height:20px"></span>
    </div>

    <a class="btn solid" style="margin-top:22px;padding:20px 0;font-size:22px">▶ Play</a>

    <div class="card" style="margin-top:18px;text-align:center">
      <div class="stars" style="font-size:24px">★ 7 stars</div>
      <p style="margin-top:6px">Level 3 is next: Mix it up</p>
    </div>

    <p class="sub" style="text-align:center;margin-top:18px">
      <span class="pill good">Piano is ready</span>
    </p>
    <p class="sub" style="text-align:center;margin-top:8px;font-size:13px">
      Calibrated today · 5 keys · good
    </p>

    <p style="text-align:center;margin-top:26px">
      <span class="back">Grown-ups</span>
    </p>
  </div>
</body>
</html>
