<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="kids.css" />
</head>
<body>
  <div class="phone">
    <div class="bar-top">
      <span class="back">‹ Map</span>
      <div class="stars" style="font-size:15px">Level 4 done</div>
    </div>
    <div class="burst">
      <div class="big">★ ★ ★</div>
      <h2>Three keys!</h2>
      <p class="sub">C4, D4 and E4 — 11 out of 11 right.</p>
    </div>
    <div class="card">
      <h3>You can play a song now</h3>
      <p>These tunes only need C, D and E — the keys you just learned.</p>
      <div style="display:flex;gap:8px;margin-top:12px">
        <span class="dot" style="background:#e5484d;width:16px;height:16px"></span>
        <span class="dot" style="background:#f76b15;width:16px;height:16px"></span>
        <span class="dot" style="background:#e8b931;width:16px;height:16px"></span>
      </div>
    </div>
    <a class="btn solid">♪ Play Hot Cross Buns</a>
    <a class="btn hollow">♪ Play Au Clair de la Lune</a>
    <a class="btn hollow">Play the level again</a>
    <a class="btn hollow">Back to the map</a>
  </div>
</body>
</html>
