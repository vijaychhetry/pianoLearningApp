<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; background: #fff6f0; font-family: "Segoe UI", sans-serif; color: #1e1633; }
    .phone { width: 390px; height: 844px; padding: 28px 22px 20px; box-sizing: border-box; }
    .home { color: #5b3cc4; font-weight: 600; font-size: 16px; }
    .label { text-align: center; margin-top: 18px; font-size: 16px; color: #6b6280; }
    .hero { text-align: center; font-size: 96px; font-weight: 800; color: #5b3cc4; line-height: 0.95; margin: 8px 0; }
    .cue { width: 56px; height: 56px; border-radius: 50%; background: #d9f0e4; color: #1f8a5b; display: grid; place-items: center; font-size: 28px; margin: 8px auto; }
    .feedback { text-align: center; font-size: 24px; font-weight: 700; }
    .meta { text-align: center; color: #6b6280; font-size: 15px; margin-top: 6px; }
    .bar { height: 10px; background: #eadfd6; border-radius: 6px; margin: 14px 0 18px; }
    .bar i { display: block; width: 20%; height: 100%; background: #1f8a5b; border-radius: 6px; }
    .kb-wrap { border: 1px solid #c8b8aa; border-radius: 10px; background: #111; padding: 8px 6px 4px; overflow: hidden; }
    .kb { position: relative; height: 128px; width: 100%; }
    .whites { display: flex; height: 104px; width: 100%; }
    .white { flex: 1 1 0; height: 104px; background: #fff; border: 1px solid #c9c1b8; position: relative; box-sizing: border-box; }
    .white.target { background: #5b3cc4; }
    .white.same { box-shadow: inset 0 0 0 2px rgba(91,60,196,0.35); }
    .white.target span { position: absolute; bottom: 6px; left: 0; right: 0; color: #fff; font-size: 8px; font-weight: 700; text-align: center; }
    .black { position: absolute; top: 0; width: 11px; height: 64px; background: #1a1a1a; border-radius: 0 0 2px 2px; }
    .octaves { display: flex; height: 18px; color: #ddd; font-size: 8px; width: 100%; }
    .octaves span { flex: 1 1 0; text-align: center; }
    .pause { display: block; margin: 18px auto 0; width: 120px; padding: 10px 0; border: 1.5px solid #5b3cc4; background: #fff; color: #5b3cc4; border-radius: 10px; font-weight: 700; font-size: 16px; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="home">Home</div>
    <div class="label">Play this key</div>
    <div class="hero">C4</div>
    <div class="cue">✓</div>
    <div class="feedback">Yes! Now D.</div>
    <div class="meta">1 of 5</div>
    <div class="bar"><i></i></div>
    <div class="kb-wrap" id="kb"></div>
    <button class="pause">Pause</button>
  </div>
  <script src="keyboard.js"></script>
  <script>renderKeyboard(document.getElementById("kb"), 60);</script>
</body>
</html>
