<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="kids.css" />
  <link rel="stylesheet" href="tools.css" />
</head>
<body>
  <div class="phone">
    <div class="bar-top">
      <span class="back">‹ Back</span>
    </div>
    <h1 style="margin-top:14px">Grown-ups</h1>
    <p class="sub" style="line-height:1.5;margin-top:8px">
      Calibrate, Audio Lab and the export files stay here so a child cannot
      change the piano setup by accident.
    </p>

    <div class="card" style="margin-top:22px">
      <div style="font-size:26px;font-weight:800;margin-bottom:14px">What is 2 + 5?</div>
      <p class="fieldlabel">ANSWER</p>
      <div class="input"><span class="ph">Type the number</span></div>
      <a class="btn solid" style="margin-top:14px">Open</a>
    </div>

    <p class="sub" style="margin-top:20px;font-size:13px;line-height:1.5">
      The two numbers change every time. A wrong answer just says
      “That is not the number.” and lets you try again.
    </p>
  </div>
</body>
</html>
